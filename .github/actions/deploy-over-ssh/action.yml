name: Deploy over SSH
description: Update compose image and restart the service over SSH.
inputs:
  host:
    description: SSH host for deployment.
    required: true
  username:
    description: SSH username.
    required: true
  ssh_private_key:
    description: SSH private key for authentication.
    required: true
  registry:
    description: Container registry host.
    required: true
  registry_repo:
    description: Container registry repository or namespace.
    required: true
  service_name:
    description: Service name and service directory name.
    required: true
  service_tag:
    description: Image tag to deploy.
    required: true
  docker_compose_file:
    description: Docker compose file path on host (relative to SERVICE_PATH).
    required: true
  coin:
    description: Base directory segment.
    required: true
  network:
    description: Network suffix (testnet|mainnet).
    required: true
  image_name:
    description: Optional image name override.
    required: false
    default: ''
  env_updated_file:
    description: Optional env file to place as .env on the server.
    required: false
    default: ''
  health_timeout_seconds:
    description: Maximum time to wait for the container healthcheck.
    required: false
    default: '180'
  public_health_url:
    description: Optional public readiness URL checked from the CI runner.
    required: false
    default: ''
  reload_nginx:
    description: Whether to reload nginx after deploy.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
  - name: Create deployment transaction ID
    id: transaction
    shell: bash
    run: echo "id=$(python3 -c 'import uuid; print(uuid.uuid4().hex)')" >> "$GITHUB_OUTPUT"
  - name: Deploy service
    uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
    env:
      CI_REGISTRY: ${{ inputs.registry }}
      CI_REGISTRY_REPO: ${{ inputs.registry_repo }}
      SERVICE_NAME: ${{ inputs.service_name }}
      SERVICE_TAG: ${{ inputs.service_tag }}
      DOCKER_COMPOSE_FILE: ${{ inputs.docker_compose_file }}
      COIN: ${{ inputs.coin }}
      NETWORK: ${{ inputs.network }}
      IMAGE_NAME_OVERRIDE: ${{ inputs.image_name }}
      ENV_UPDATED_FILE: ${{ inputs.env_updated_file }}
      HEALTH_TIMEOUT_SECONDS: ${{ inputs.health_timeout_seconds }}
      RELOAD_NGINX: ${{ inputs.reload_nginx }}
      DEPLOYMENT_ID: ${{ steps.transaction.outputs.id }}
      DEPLOY_PHASE: deploy
    with:
      host: ${{ inputs.host }}
      username: ${{ inputs.username }}
      key: ${{ inputs.ssh_private_key }}
      envs: CI_REGISTRY,CI_REGISTRY_REPO,SERVICE_NAME,SERVICE_TAG,DOCKER_COMPOSE_FILE,COIN,NETWORK,IMAGE_NAME_OVERRIDE,ENV_UPDATED_FILE,HEALTH_TIMEOUT_SECONDS,RELOAD_NGINX,DEPLOYMENT_ID,DEPLOY_PHASE
      script_path: ${{ github.action_path }}/deploy.sh
      command_timeout: 45m
    id: deploy
  - name: Check public readiness from CI runner
    id: public
    if: inputs.public_health_url != ''
    shell: bash
    env:
      PUBLIC_HEALTH_URL: ${{ inputs.public_health_url }}
    run: 'set -euo pipefail

      curl --fail --silent --show-error --output /dev/null --connect-timeout 5 --max-time 10 --retry 5 --retry-delay 3 --retry-all-errors "$PUBLIC_HEALTH_URL"

      '
  - name: Commit deployment transaction
    uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
    env:
      CI_REGISTRY: ${{ inputs.registry }}
      CI_REGISTRY_REPO: ${{ inputs.registry_repo }}
      SERVICE_NAME: ${{ inputs.service_name }}
      SERVICE_TAG: ${{ inputs.service_tag }}
      DOCKER_COMPOSE_FILE: ${{ inputs.docker_compose_file }}
      COIN: ${{ inputs.coin }}
      NETWORK: ${{ inputs.network }}
      IMAGE_NAME_OVERRIDE: ${{ inputs.image_name }}
      ENV_UPDATED_FILE: ${{ inputs.env_updated_file }}
      HEALTH_TIMEOUT_SECONDS: ${{ inputs.health_timeout_seconds }}
      RELOAD_NGINX: ${{ inputs.reload_nginx }}
      DEPLOYMENT_ID: ${{ steps.transaction.outputs.id }}
      DEPLOY_PHASE: commit
    with:
      host: ${{ inputs.host }}
      username: ${{ inputs.username }}
      key: ${{ inputs.ssh_private_key }}
      envs: CI_REGISTRY,CI_REGISTRY_REPO,SERVICE_NAME,SERVICE_TAG,DOCKER_COMPOSE_FILE,COIN,NETWORK,IMAGE_NAME_OVERRIDE,ENV_UPDATED_FILE,HEALTH_TIMEOUT_SECONDS,RELOAD_NGINX,DEPLOYMENT_ID,DEPLOY_PHASE
      script_path: ${{ github.action_path }}/deploy.sh
      command_timeout: 45m
    id: commit
  - name: Restore previous deployment on failure
    uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
    env:
      CI_REGISTRY: ${{ inputs.registry }}
      CI_REGISTRY_REPO: ${{ inputs.registry_repo }}
      SERVICE_NAME: ${{ inputs.service_name }}
      SERVICE_TAG: ${{ inputs.service_tag }}
      DOCKER_COMPOSE_FILE: ${{ inputs.docker_compose_file }}
      COIN: ${{ inputs.coin }}
      NETWORK: ${{ inputs.network }}
      IMAGE_NAME_OVERRIDE: ${{ inputs.image_name }}
      ENV_UPDATED_FILE: ${{ inputs.env_updated_file }}
      HEALTH_TIMEOUT_SECONDS: ${{ inputs.health_timeout_seconds }}
      RELOAD_NGINX: ${{ inputs.reload_nginx }}
      DEPLOYMENT_ID: ${{ steps.transaction.outputs.id }}
      DEPLOY_PHASE: rollback
    with:
      host: ${{ inputs.host }}
      username: ${{ inputs.username }}
      key: ${{ inputs.ssh_private_key }}
      envs: CI_REGISTRY,CI_REGISTRY_REPO,SERVICE_NAME,SERVICE_TAG,DOCKER_COMPOSE_FILE,COIN,NETWORK,IMAGE_NAME_OVERRIDE,ENV_UPDATED_FILE,HEALTH_TIMEOUT_SECONDS,RELOAD_NGINX,DEPLOYMENT_ID,DEPLOY_PHASE
      script_path: ${{ github.action_path }}/deploy.sh
      command_timeout: 45m
    id: rollback
    if: always() && steps.deploy.outcome != 'skipped' && (failure() || cancelled())
