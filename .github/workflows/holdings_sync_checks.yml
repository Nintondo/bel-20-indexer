name: Holdings sync checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/holdings-sync]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y clang cmake libclang-dev
      - run: cargo test --locked --workspace
