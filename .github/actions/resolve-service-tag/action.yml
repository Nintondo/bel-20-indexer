name: Resolve service tag
description: Select and validate the immutable commit SHA for deployment.
inputs:
  log_ref:
    description: Whether to log the dispatch source ref.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Resolve SERVICE_TAG
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_SHA: ${{ github.event.inputs.sha }}
        DISPATCH_SHA: ${{ github.event.client_payload.sha }}
        DISPATCH_REF: ${{ github.event.client_payload.ref }}
        FALLBACK_SHA: ${{ github.sha }}
        LOG_REF: ${{ inputs.log_ref }}
      run: |
        set -euo pipefail
        if [ "$EVENT_NAME" = repository_dispatch ]; then
          SERVICE_TAG="${DISPATCH_SHA:-$FALLBACK_SHA}"
          if [ "$LOG_REF" = true ]; then printf 'Ref: %s\n' "$DISPATCH_REF"; fi
        else
          SERVICE_TAG="${INPUT_SHA:-$FALLBACK_SHA}"
        fi
        if ! [[ "$SERVICE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::Deploy requires a full 40-character commit SHA"
          exit 1
        fi
        printf 'SERVICE_TAG=%s\n' "$SERVICE_TAG" >> "$GITHUB_ENV"
